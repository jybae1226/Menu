<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy Menu Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .selected { border: 3px solid #6366f1 !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
            <h1 class="text-xl font-black text-indigo-600">🍴 Buddy Menu</h1>
            <button onclick="toggleAdmin()" class="text-xs bg-slate-200 px-3 py-1 rounded-full text-slate-500">Admin Mode</button>
        </header>

        <section id="admin-panel" class="hidden space-y-4 bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-indigo-900 text-lg">Admin Dashboard</h2>
                <button onclick="closeAdmin()" class="text-xs text-indigo-400">Close</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-inner space-y-3">
                <p class="text-xs font-bold text-slate-400 uppercase">1. Upload & Translate</p>
                <input type="file" id="menu-image" accept="image/*" class="text-sm block w-full">
                <button onclick="processMenu()" id="ocr-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">Scan & Translate (KR→EN)</button>
                <div id="status" class="text-[10px] text-center text-indigo-400"></div>
                
                <p class="text-xs font-bold text-slate-400 uppercase mt-4">2. Edit List (Use '/' to separate)</p>
                <textarea id="menu-list-input" class="w-full p-3 border rounded-lg text-sm h-24" placeholder="Menu 1 / Menu 2 / Menu 3"></textarea>
                <button onclick="saveMenu()" class="w-full bg-emerald-500 text-white py-2 rounded-lg font-bold">Publish to Students</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-inner">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-xs font-bold text-slate-400 uppercase">3. Order Summary</p>
                    <button onclick="refreshStats()" class="text-xs bg-slate-100 px-2 py-1 rounded">Refresh</button>
                </div>
                <div id="admin-stats-area" class="text-sm space-y-4">
                    </div>
            </div>
        </section>

        <section id="menu-photo-viewer" class="hidden bg-white p-2 rounded-2xl shadow-sm overflow-hidden">
            <img id="shared-menu-img" class="w-full h-auto rounded-xl" src="" alt="Menu Original Photo">
            <p class="text-[10px] text-center text-slate-400 py-1 font-medium italic">Original Menu Photo</p>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="mb-4">
                <h2 class="text-lg font-bold text-slate-800">Select Menu (Multiple)</h2>
                <p class="text-xs text-slate-400">Choose all items you want to order</p>
            </div>
            
            <div id="student-menu-container" class="grid grid-cols-1 gap-3 mb-6">
                </div>

            <div class="space-y-3">
                <input type="text" id="student-name" placeholder="Enter your name" class="w-full p-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none font-medium">
                <button onclick="submitOrder()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-lg shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Submit Order</button>
            </div>
        </section>
    </div>

    <script>
        // --- 설정 (본인의 정보로 교체 필수!) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBzR_ECNVoulaILVVh5tPqPOenfq-MNIqA",
            authDomain: "menu-657dc.firebaseapp.com",
            projectId: "menu-657dc",
            storageBucket: "menu-657dc.firebasestorage.app",
            messagingSenderId: "228708591373",
            appId: "1:228708591373:web:884f2c2e90c4323254f244"
        };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzH1pghDcM-m3ELfqdJ3i2Iy0I2n1Fx9YLaT4kW57Iyppjm3KhXFPEC6pU79XTYd9j7LA/exec";
        const ADMIN_PIN = "1234"; // 관리자 암호 설정

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let selectedMenus = new Set();
        let base64Image = "";

        // [기능 0] 관리자 토글
        function toggleAdmin() {
            const pin = prompt("Enter Admin PIN:");
            if(pin === ADMIN_PIN) {
                document.getElementById('admin-panel').classList.remove('hidden');
                refreshStats();
            } else {
                alert("Wrong PIN!");
            }
        }
        function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }

        // [기능 1] 사진 처리 및 번역 (구분자 / 사용)
        async function processMenu() {
            const file = document.getElementById('menu-image').files[0];
            if(!file) return alert("Select Image!");

            const btn = document.getElementById('ocr-btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Processing image...";

            // 사진을 Base64로 변환 (학생들도 보게 하기 위함)
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                base64Image = reader.result;
                
                try {
                    const { data: { text } } = await Tesseract.recognize(file, 'kor');
                    const cleanText = text.split('\n').filter(t => t.trim().length > 1).join(' / ');

                    status.innerText = "Translating...";
                    const res = await fetch(`${GOOGLE_SCRIPT_URL}?q=${encodeURIComponent(cleanText)}`);
                    const translated = await res.text();

                    document.getElementById('menu-list-input').value = translated;
                    status.innerText = "Done!";
                } catch(e) { alert(e.message); }
                btn.disabled = false;
            };
        }

        // [기능 2] 메뉴 DB 저장 (이미지 포함)
        async function saveMenu() {
            const listStr = document.getElementById('menu-list-input').value;
            const items = listStr.split('/').map(i => i.trim()).filter(i => i !== "");
            
            await db.collection("settings").doc("currentMenu").set({
                items: items,
                photo: base64Image,
                updatedAt: new Date()
            });
            alert("Menu Updated!");
        }

        // [기능 3] 학생 화면 렌더링 (다중 선택 가능)
        function renderStudentView() {
            db.collection("settings").doc("currentMenu").onSnapshot(doc => {
                if(!doc.exists) return;
                const data = doc.data();
                
                // 사진 표시
                if(data.photo) {
                    const viewer = document.getElementById('menu-photo-viewer');
                    viewer.classList.remove('hidden');
                    document.getElementById('shared-menu-img').src = data.photo;
                }

                // 메뉴 버튼 생성
                const container = document.getElementById('student-menu-container');
                container.innerHTML = "";
                data.items.forEach(item => {
                    const b = document.createElement('button');
                    b.innerText = item;
                    b.className = "w-full p-4 border rounded-xl bg-white text-left transition-all font-medium text-slate-700 shadow-sm";
                    b.onclick = () => {
                        if(selectedMenus.has(item)) {
                            selectedMenus.delete(item);
                            b.classList.remove('selected');
                        } else {
                            selectedMenus.add(item);
                            b.classList.add('selected');
                        }
                    };
                    container.appendChild(b);
                });
            });
        }

        // [기능 4] 주문 제출 (여러 메뉴 지원)
        async function submitOrder() {
            const name = document.getElementById('student-name').value.trim();
            if(!name || selectedMenus.size === 0) return alert("Enter name and select at least one menu!");

            await db.collection("orders").add({
                name: name,
                menus: Array.from(selectedMenus), // 배열로 저장
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Order Submitted! Thanks " + name);
            location.reload(); // 선택 초기화
        }

        // [기능 5] 관리자 대시보드 (취소 기능 포함)
        async function refreshStats() {
            const snap = await db.collection("orders").orderBy("timestamp", "desc").get();
            const area = document.getElementById('admin-stats-area');
            
            let menuStats = {};
            let personHtml = `<p class="font-bold text-indigo-600">[Individual Orders]</p>`;

            snap.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                
                // 통계 계산
                data.menus.forEach(m => {
                    menuStats[m] = (menuStats[m] || 0) + 1;
                });

                // 리스트 UI (취소 버튼 포함)
                personHtml += `
                    <div class="flex justify-between items-center bg-indigo-100/50 p-2 rounded">
                        <span><strong>${data.name}</strong>: ${data.menus.join(', ')}</span>
                        <button onclick="cancelOrder('${id}')" class="text-red-500 text-xs font-bold bg-white px-2 py-1 rounded shadow-sm">Cancel</button>
                    </div>
                `;
            });

            let statsHtml = `<p class="font-bold text-indigo-600">[Menu Totals]</p>`;
            for(let m in menuStats) statsHtml += `<p>${m}: <strong>${menuStats[m]}</strong></p>`;

            area.innerHTML = statsHtml + `<hr class="my-3 border-indigo-200">` + personHtml;
        }

        // [기능 6] 주문 취소
        async function cancelOrder(id) {
            if(confirm("정말 이 주문을 취소할까요?")) {
                await db.collection("orders").doc(id).delete();
                refreshStats();
            }
        }

        // 초기 로드
        renderStudentView();
    </script>
</body>
</html>
