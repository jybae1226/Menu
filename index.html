<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy Menu Pro (KR/EN)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .selected { border: 3px solid #6366f1 !important; background-color: #eef2ff !important; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-xl font-black text-indigo-600">🍴 Menu</h1>
            <button onclick="toggleAdmin()" class="text-xs bg-slate-200 px-3 py-1 rounded-full text-slate-500 font-bold">관리 모드 (Admin)</button>
        </header>

        <section id="admin-panel" class="hidden space-y-4 bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200 shadow-xl">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-indigo-900 text-lg">Admin Dashboard</h2>
                <button onclick="resetSystem()" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded">식당 데이터 전체삭제</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-inner space-y-3 border border-indigo-100">
                <p class="text-xs font-bold text-slate-400 uppercase">1. 메뉴판 사진 업로드</p>
                <input type="file" id="menu-image" accept="image/*" class="text-sm block w-full">
                <button onclick="processMenu()" id="ocr-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">인식 및 번역 (KR+EN)</button>
                <div id="status" class="text-[10px] text-center text-indigo-500 font-bold animate-pulse"></div>
                
                <p class="text-xs font-bold text-slate-400 uppercase mt-4">2. 목록 수정 ('/'로 구분)</p>
                <textarea id="menu-list-input" class="w-full p-3 border rounded-lg text-sm h-32" placeholder="메뉴 이름 (Menu Name) / ..."></textarea>
                <button onclick="saveMenu()" class="w-full bg-emerald-500 text-white py-2 rounded-lg font-bold">학생들에게 메뉴 공개</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-inner border border-indigo-100">
                <p class="text-xs font-bold text-slate-400 uppercase mb-4">3. 주문 실시간 합계</p>
                <div id="admin-stats-area" class="text-sm space-y-4">
                    </div>
            </div>
        </section>

        <section id="menu-photo-viewer" class="hidden bg-white p-2 rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <img id="shared-menu-img" class="w-full h-auto rounded-xl" src="" alt="Menu">
            <p class="text-[10px] text-center text-slate-400 py-1 italic">Original Menu Photo</p>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <div class="mb-4">
                <h2 class="text-xl font-black text-slate-800 italic underline decoration-indigo-300">Choose your menu!</h2>
                <p class="text-xs text-slate-400">Multiple selection is possible.</p>
            </div>
            
            <div id="student-menu-container" class="grid grid-cols-1 gap-3 mb-6">
                </div>

            <div class="space-y-3 pt-4 border-t border-slate-100">
                <input type="text" id="student-name" placeholder="Enter your name" class="w-full p-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none font-bold text-slate-700">
                <button onclick="submitOrder()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-lg shadow-lg active:scale-95 transition-all">Submit Order</button>
            </div>
        </section>
    </div>

    <script>
        // --- 설정 (Firebase 설정은 유지) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBzR_ECNVoulaILVVh5tPqPOenfq-MNIqA",
            authDomain: "menu-657dc.firebaseapp.com",
            projectId: "menu-657dc",
            storageBucket: "menu-657dc.firebasestorage.app",
            messagingSenderId: "228708591373",
            appId: "1:228708591373:web:884f2c2e90c4323254f244"
        };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzH1pghDcM-m3ELfqdJ3i2Iy0I2n1Fx9YLaT4kW57Iyppjm3KhXFPEC6pU79XTYd9j7LA/exec";
        const ADMIN_PIN = "4321";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let selectedMenus = new Set();
        let currentBase64 = "";

        // 관리자 모드 열기
        function toggleAdmin() {
            const pin = prompt("Admin PIN:");
            if(pin === ADMIN_PIN) document.getElementById('admin-panel').classList.toggle('hidden');
            else alert("Access Denied");
        }

        // [기능 1] 한/영 병기 프로세싱
        async function processMenu() {
            const file = document.getElementById('menu-image').files[0];
            if(!file) return alert("Select Photo!");

            const btn = document.getElementById('ocr-btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "⏳ 1단계: 글자 인식 중...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                currentBase64 = reader.result;
                try {
                    // OCR (한국어 위주)
                    const { data: { text } } = await Tesseract.recognize(file, 'kor');
                    const lines = text.split('\n').filter(t => t.trim().length > 1);
                    
                    status.innerText = "⏳ 2단계: 번역 중...";
                    let results = [];
                    for(let line of lines) {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?q=${encodeURIComponent(line)}`);
                        const translated = await res.text();
                        // "한국어 (English)" 형식으로 생성
                        results.push(`${line.trim()} (${translated.trim()})`);
                    }

                    document.getElementById('menu-list-input').value = results.join(' / ');
                    status.innerText = "✅ 인식 및 번역 완료!";
                } catch(e) { alert(e.message); status.innerText = ""; }
                btn.disabled = false;
            };
        }

        // [기능 2] 데이터 저장 (영구 보존)
        async function saveMenu() {
            const listStr = document.getElementById('menu-list-input').value;
            const items = listStr.split('/').map(i => i.trim()).filter(i => i !== "");
            
            await db.collection("settings").doc("currentMenu").set({
                items: items,
                photo: currentBase64 || "",
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("메뉴가 공개되었습니다!");
        }

        async function saveMenu() {
            const listStr = document.getElementById('menu-list-input').value;
            const items = listStr.split('/').map(i => i.trim()).filter(i => i !== "");
    
            if(items.length === 0) return alert("메뉴가 비어있습니다!");

            try {
                await db.collection("settings").doc("currentMenu").set({
                    items: items,
                    photo: currentBase64 || "", // 여기서 에러가 나면 사진 용량이 너무 큰 것임
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ 서버 저장 성공! 이제 학생들도 볼 수 있습니다.");
            } catch (error) {
                console.error("저장 에러:", error);
                alert("❌ 저장 실패! 사진 용량이 너무 크거나 설정 오류입니다. (사진 없이 시도해 보세요)");
            }
        }

        // [기능 3] 실시간 동기화 (onSnapshot 사용 - 이게 핵심입니다!)
        function startSync() {
            // 메뉴 & 사진 동기화
            db.collection("settings").doc("currentMenu").onSnapshot(doc => {
                if(!doc.exists) return;
                const data = doc.data();
                
                // 사진 처리
                if(data.photo) {
                    document.getElementById('menu-photo-viewer').classList.remove('hidden');
                    document.getElementById('shared-menu-img').src = data.photo;
                }

                // 버튼 처리
                const container = document.getElementById('student-menu-container');
                container.innerHTML = "";
                data.items.forEach(item => {
                    const b = document.createElement('button');
                    b.innerText = item;
                    b.className = "w-full p-4 border rounded-xl bg-white text-left transition-all font-bold text-slate-700 shadow-sm";
                    b.onclick = () => {
                        if(selectedMenus.has(item)) {
                            selectedMenus.delete(item);
                            b.classList.remove('selected');
                        } else {
                            selectedMenus.add(item);
                            b.classList.add('selected');
                        }
                    };
                    container.appendChild(b);
                });
            });

            // 주문 현황 실시간 동기화 (관리자용)
            db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snap => {
                const area = document.getElementById('admin-stats-area');
                let menuCounts = {};
                let individualList = `<p class="font-bold text-indigo-600">[Individual Orders]</p>`;

                snap.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    d.menus.forEach(m => { menuCounts[m] = (menuCounts[m] || 0) + 1; });
                    individualList += `
                        <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                            <span><strong>${d.name}</strong>: ${d.menus.join(', ')}</span>
                            <button onclick="cancelOrder('${id}')" class="text-red-500 text-[10px] font-bold">CANCEL</button>
                        </div>`;
                });

                let totalHtml = `<p class="font-bold text-indigo-600">[Menu Totals]</p>`;
                for(let m in menuCounts) totalHtml += `<p>${m}: <strong>${menuCounts[m]}명</strong></p>`;
                area.innerHTML = totalHtml + `<hr class="my-2">` + individualList;
            });
        }

        // [기능 4] 주문 제출
        async function submitOrder() {
            const nameInput = document.getElementById('student-name');
            const name = nameInput.value.trim();
    
            if(!name || selectedMenus.size === 0) {
                return alert("Please enter your name and select at least one menu!");
            }

            try {
                // 1. Firebase에 주문 데이터 전송
                await db.collection("orders").add({
                    name: name,
                    menus: Array.from(selectedMenus),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
        
                alert("Order Success! Enjoy your meal, " + name);

                // 2. 선택된 메뉴 데이터(Set) 초기화
                selectedMenus.clear();

                // 3. 버튼의 선택 효과(파란색 테두리 등) 모두 제거
                const buttons = document.querySelectorAll('#student-menu-container button');
                buttons.forEach(btn => {
                    btn.classList.remove('selected');
                });

                // 4. 입력했던 이름 칸 비우기
                nameInput.value = "";

            } catch (error) {
                console.error("Order Error:", error);
                alert("Order failed. Please try again.");
            }
        }

        // [기능 5] 관리자 전용 삭제
        async function cancelOrder(id) {
            if(confirm("이 주문을 삭제할까요?")) await db.collection("orders").doc(id).delete();
        }

        async function resetSystem() {
            if(!confirm("이번 식당의 모든 메뉴와 주문을 완전히 초기화할까요?")) return;
            const orders = await db.collection("orders").get();
            const batch = db.batch();
            orders.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            await db.collection("settings").doc("currentMenu").delete();
            location.reload();
        }

        startSync();
    </script>
</body>
</html>
